services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.17.1}
    container_name: trial_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_SERVER_STORAGE:-./qdrant_storage}:/qdrant/storage
      - ${QDRANT_SNAPSHOTS_DIR:-./qdrant_snapshots}:/qdrant/snapshots
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots

  api:
    build: .
    container_name: trial_api
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    restart: unless-stopped

  # Optional: self-hosted Langfuse for tracing
