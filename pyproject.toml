[project]
name = "trial-matcher"
version = "0.1.0"
description = "Agentic IA system for patient-clinical trial matching, benchmarked on TREC CT 2021/2022."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Trial Matcher Team"}]
license = {text = "MIT"}

dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "pydantic-ai>=0.0.13",
    "instructor>=1.3",
    "loguru>=0.7",
    "rich>=13.7",
    "tenacity>=8.3",
    "diskcache>=5.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # LLM clients
    "openai>=1.30",
    "groq>=0.9",
    "httpx>=0.27",
    # Retrieval
    "bm25s>=0.2.0",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",
    # NLP
    "spacy>=3.7",
    "negspacy>=1.0.4",
    "scispacy>=0.5.4",
    # ML
    "torch>=2.3",
    "transformers>=4.40",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # Agent
    "langgraph>=0.2.0",
    "langchain-core>=0.3",
    # Eval
    "pytrec-eval>=0.5",
    # API / runner
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "click>=8.1",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]
listwise = [
    "rank-llm>=0.13",
]

[project.scripts]
trial-matcher = "trial_matcher.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trial_matcher"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring fixtures",
    "needs_llm: tests that hit a real LLM (skipped by default)",
    "needs_gpu: tests that require GPU",
]
# pytest-asyncio is optional. Tests that need to drive coroutines call
# asyncio.run(...) inline, which works without the plugin.

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
